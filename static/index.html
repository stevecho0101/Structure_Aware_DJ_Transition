<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Structure-Aware Automix</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0d0d0d; color: #f0f0f0; min-height: 100vh; padding: 2rem; }
.header { display: flex; align-items: center; gap: 12px; margin-bottom: 2rem; }
.logo { width: 40px; height: 40px; background: #f0f0f0; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; }
.app-title { font-size: 20px; font-weight: 600; }
.app-sub { font-size: 13px; color: #888; margin-top: 2px; }
.search-input { width: 100%; background: #1a1a1a; color: #f0f0f0; border: 1px solid #333; border-radius: 8px; padding: 10px 14px; font-size: 14px; outline: none; margin-bottom: 8px; }
.select-row { display: flex; gap: 10px; margin-bottom: 1.5rem; align-items: center; }
select { background: #1a1a1a; color: #f0f0f0; border: 1px solid #333; border-radius: 8px; padding: 10px 14px; font-size: 14px; flex: 1; outline: none; }
.btn { padding: 10px 20px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; border: none; transition: all 0.15s; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-play { background: #1db954; color: #fff; min-width: 80px; }
.btn-play:hover:not(:disabled) { background: #1aa34a; }
.btn-skip { background: #222; color: #f0f0f0; border: 1px solid #333; padding: 10px 14px; font-size: 13px; }
.btn-skip:hover:not(:disabled) { background: #2a2a2a; }
.btn-next { background: #f59e0b; color: #000; font-weight: 600; }
.btn-next:hover:not(:disabled) { background: #d97706; }
.btn-accept { background: #1db954; color: #fff; flex: 1; }
.btn-accept:hover { background: #1aa34a; }
.player-card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem; }
.player-label { font-size: 11px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
.live-badge { background: #1db954; color: #fff; font-size: 10px; padding: 2px 8px; border-radius: 20px; animation: pulse 2s infinite; }
.next-badge { background: #333; color: #888; font-size: 10px; padding: 2px 8px; border-radius: 20px; }
.song-name { font-size: 16px; font-weight: 600; margin-bottom: 2px; }
.song-meta { font-size: 13px; color: #888; margin-bottom: 14px; }
.progress-wrap { position: relative; margin-bottom: 6px; cursor: pointer; padding: 6px 0; }
.progress-bg { height: 4px; background: #333; border-radius: 2px; }
.progress-fill { height: 4px; background: #1db954; border-radius: 2px; width: 0%; pointer-events: none; }
.transition-marker { position: absolute; top: 2px; width: 3px; height: 12px; background: #f59e0b; border-radius: 2px; transform: translateX(-50%); pointer-events: none; }
.time-row { display: flex; justify-content: space-between; font-size: 11px; color: #666; margin-top: 4px; margin-bottom: 12px; }
.controls-row { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
.structure { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
.pill { font-size: 11px; font-weight: 500; padding: 3px 8px; border-radius: 20px; }
.pill-intro { background: #1e3a5f; color: #7eb8f7; }
.pill-verse { background: #1a3a1a; color: #6fcf6f; }
.pill-chorus { background: #3a2a00; color: #f5c842; }
.pill-outro { background: #2a1a3a; color: #b07ef7; }
.pill.active { outline: 2px solid #fff; outline-offset: 1px; }
.cut-info { font-size: 12px; color: #666; margin-bottom: 8px; }
.cut-info span { color: #f5c842; font-weight: 500; }
.effect-label { font-size: 11px; color: #666; margin-bottom: 6px; }
.effect-row { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
.effect-btn { padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 500; cursor: pointer; border: 1px solid #333; background: #222; color: #888; transition: all 0.15s; }
.effect-btn.active { background: #f59e0b; color: #000; border-color: #f59e0b; }
.effect-btn:hover:not(.active) { background: #2a2a2a; color: #f0f0f0; }
.effect-reason { font-size: 12px; color: #888; font-style: italic; margin-bottom: 12px; }
.reasoning { background: #111; border: 1px solid #222; border-radius: 10px; padding: 1rem 1.25rem; margin-bottom: 12px; }
.reasoning-label { font-size: 11px; font-weight: 600; color: #666; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; }
.reasoning-text { font-size: 13px; color: #888; line-height: 1.7; }
.accept-row { display: flex; gap: 8px; }
.feedback-card { background: #1a1a1a; border: 1px solid #f59e0b55; border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem; }
.feedback-label { font-size: 11px; font-weight: 600; color: #f59e0b; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; }
.feedback-sub { font-size: 12px; color: #666; margin-bottom: 12px; }
.stars { display: flex; gap: 8px; margin-bottom: 12px; }
.star { font-size: 24px; cursor: pointer; transition: transform 0.1s; opacity: 0.3; }
.star:hover, .star.active { opacity: 1; transform: scale(1.2); }
.feedback-input { width: 100%; background: #111; border: 1px solid #333; border-radius: 8px; padding: 10px 14px; color: #f0f0f0; font-size: 13px; outline: none; margin-bottom: 10px; resize: none; }
.btn-submit-feedback { background: #f59e0b; color: #000; font-weight: 600; width: 100%; }
.btn-submit-feedback:hover { background: #d97706; }
.status { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #666; margin-top: 1rem; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: #1db954; }
.dot.thinking { background: #f59e0b; animation: pulse 0.8s infinite; }
.dot.idle { background: #555; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
.hidden { display: none; }
.crossfade-overlay { position: fixed; top: 20px; right: 20px; background: #f59e0b; color: #000; font-size: 13px; font-weight: 600; padding: 10px 16px; border-radius: 8px; z-index: 100; }
</style>
</head>
<body>

<div class="header">
  <div class="logo">🎛️</div>
  <div>
    <div class="app-title">Structure-Aware Automix</div>
    <div class="app-sub">Live DJ transition assistant</div>
  </div>
</div>

<input class="search-input" id="searchInput" oninput="filterSongs()" placeholder="Search songs...">

<div class="select-row">
  <select id="songSelect"><option value="">Select a song to play...</option></select>
  <button class="btn btn-play" id="playBtn" onclick="startPlayback()">▶ Play</button>
</div>

<div id="nowPlayingCard" class="player-card hidden">
  <div class="player-label">Now playing <span class="live-badge">● LIVE</span></div>
  <div class="song-name" id="nowName">—</div>
  <div class="song-meta" id="nowMeta">—</div>
  <div class="progress-wrap" id="progressWrap" onclick="seekClick(event)">
    <div class="progress-bg"><div class="progress-fill" id="progressFill"></div></div>
    <div class="transition-marker hidden" id="transitionMarker"></div>
  </div>
  <div class="time-row">
    <span id="currentTime">0:00</span>
    <span id="transitionHint" style="color:#f5c842"></span>
    <span id="totalTime">0:00</span>
  </div>
  <div class="controls-row">
    <button class="btn btn-skip" onclick="seekBy(-10)">⏪ -10s</button>
    <button class="btn btn-skip" onclick="seekBy(-5)">◀ -5s</button>
    <button class="btn btn-skip" id="pauseBtn" onclick="togglePause()">⏸ Pause</button>
    <button class="btn btn-skip" onclick="seekBy(5)">+5s ▶</button>
    <button class="btn btn-skip" onclick="seekBy(10)">+10s ⏩</button>
    <button class="btn btn-next" id="skipNextBtn" onclick="skipToNext()" disabled>Skip to next ⏭</button>
  </div>
  <div class="structure" id="nowStructure"></div>
</div>

<div id="upNextCard" class="player-card hidden">
  <div class="player-label">Up next <span class="next-badge">QUEUED</span></div>
  <div class="song-name" id="nextName">—</div>
  <div class="song-meta" id="nextMeta">—</div>
  <div class="structure" id="nextStructure"></div>
  <div class="cut-info">Entering at <span id="nextCutIn">—</span> — <span id="nextSection">—</span></div>
  <div class="effect-label">Transition effect</div>
  <div class="effect-row">
    <button class="effect-btn" onclick="setEffect('auto',this)">✦ Auto</button>
    <button class="effect-btn" onclick="setEffect('crossfade',this)">Crossfade</button>
    <button class="effect-btn" onclick="setEffect('eq_sweep',this)">EQ Sweep</button>
    <button class="effect-btn" onclick="setEffect('lpf_sweep',this)">LPF Sweep</button>
    <button class="effect-btn" onclick="setEffect('beatmatch',this)">Beatmatch</button>
  </div>
  <div class="effect-reason" id="effectReason">—</div>
  <div class="reasoning">
    <div class="reasoning-label">✦ Agent reasoning</div>
    <div class="reasoning-text" id="reasoningText">—</div>
  </div>
  <div class="accept-row">
    <button class="btn btn-accept" id="acceptBtn" onclick="acceptTransition()" disabled>✓ Accept & queue</button>
  </div>
</div>

<div id="feedbackCard" class="feedback-card hidden">
  <div class="feedback-label">How was that transition?</div>
  <div class="feedback-sub">Rate what you just heard — helps the agent pick better next time</div>
  <div class="stars">
    <span class="star" onclick="setRating(1)">★</span>
    <span class="star" onclick="setRating(2)">★</span>
    <span class="star" onclick="setRating(3)">★</span>
    <span class="star" onclick="setRating(4)">★</span>
    <span class="star" onclick="setRating(5)">★</span>
  </div>
  <textarea class="feedback-input" id="feedbackComment" rows="2" placeholder="Any comments? e.g. too abrupt, wrong vibe, energy drop (optional)"></textarea>
  <button class="btn btn-submit-feedback" onclick="submitFeedback()">Submit feedback</button>
</div>

<div class="status">
  <div class="dot idle" id="statusDot"></div>
  <span id="statusText">Select a song to start</span>
</div>

<script>
let audioCtx = null;
let currentSource = null;
let currentGain = null;
let currentBuffer = null;
let nextBuffer = null;
let startTime = 0;
let seekOffset = 0;
let isPlaying = false;
let isPaused = false;
let agentResult = null;
let transitionScheduled = false;
let progressInterval = null;
let currentSongDuration = 0;
let currentSongFile = null;
let sessionId = Math.random().toString(36).slice(2);
let currentRating = 0;
let lastTransitionSong = null;
let allSongs = [];
let forcedMode = null;

async function loadSongs() {
  const res = await fetch('/songs');
  const data = await res.json();
  allSongs = data.songs;
  renderSongs(allSongs);
}

function renderSongs(songs) {
  const sel = document.getElementById('songSelect');
  sel.innerHTML = '<option value="">Select a song to play...</option>';
  songs.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s;
    opt.textContent = s.replace('.mp3','').replace(/_/g,' ');
    sel.appendChild(opt);
  });
}

function filterSongs() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  renderSongs(allSongs.filter(s => s.replace(/_/g,' ').toLowerCase().includes(q)));
}

function setEffect(mode, btn) {
  forcedMode = mode === 'auto' ? null : mode;
  document.querySelectorAll('.effect-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('effectReason').textContent = forcedMode
    ? `Effect locked to: ${forcedMode}`
    : (agentResult ? agentResult.effect_reason : '—');
}

function toMMSS(sec) {
  const m = Math.floor(sec/60), s = Math.floor(sec%60);
  return m+':'+s.toString().padStart(2,'0');
}

function setStatus(text, state) {
  document.getElementById('statusText').textContent = text;
  document.getElementById('statusDot').className = 'dot '+(state||'idle');
}

function getElapsed() {
  if (!audioCtx) return 0;
  return audioCtx.currentTime - startTime + seekOffset;
}

function setRating(r) {
  currentRating = r;
  document.querySelectorAll('.star').forEach((s,i) => s.classList.toggle('active', i<r));
}

async function fetchAudio(filename) {
  if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  const res = await fetch('/song_playlist/'+filename);
  const buf = await res.arrayBuffer();
  return audioCtx.decodeAudioData(buf);
}

function renderStructure(id, sections) {
  const el = document.getElementById(id);
  el.innerHTML = '';
  (sections||[]).forEach(s => {
    const pill = document.createElement('span');
    pill.className = 'pill pill-'+s.section;
    pill.id = 'pill-'+id+'-'+s.start_sec;
    pill.textContent = s.section+' '+toMMSS(s.start_sec);
    el.appendChild(pill);
  });
}

function rebuildCurrentSource(offset) {
  if (currentSource) { try { currentSource.stop(); } catch(e){} }
  currentSource = audioCtx.createBufferSource();
  currentSource.buffer = currentBuffer;
  currentSource.connect(currentGain);
  const safe = Math.max(0, Math.min(offset, currentSongDuration-0.1));
  currentSource.start(0, safe);
  seekOffset = safe;
  startTime = audioCtx.currentTime;
  transitionScheduled = false;
}

function seekBy(s) { if (isPlaying) rebuildCurrentSource(getElapsed()+s); }

function seekClick(e) {
  if (!isPlaying) return;
  const rect = document.getElementById('progressWrap').getBoundingClientRect();
  rebuildCurrentSource(((e.clientX-rect.left)/rect.width)*currentSongDuration);
}

function togglePause() {
  if (!isPlaying) return;
  const btn = document.getElementById('pauseBtn');
  if (!isPaused) { audioCtx.suspend(); isPaused=true; btn.textContent='▶ Resume'; }
  else { audioCtx.resume(); isPaused=false; btn.textContent='⏸ Pause'; }
}

function skipToNext() {
  if (!agentResult||!nextBuffer) return;
  transitionScheduled = true;
  doLiveTransition();
}

function updateProgress() {
  if (!isPlaying||!audioCtx) return;
  const elapsed = getElapsed();
  document.getElementById('progressFill').style.width = Math.min(100,(elapsed/currentSongDuration)*100)+'%';
  document.getElementById('currentTime').textContent = toMMSS(elapsed);

  if (agentResult&&agentResult._accepted) {
    const tOut = agentResult.transition_out.time_sec;
    const remaining = tOut-elapsed;
    if (remaining>0&&remaining<30) document.getElementById('transitionHint').textContent='transition in '+Math.ceil(remaining)+'s';
    else if (remaining<=0) document.getElementById('transitionHint').textContent='transitioning...';
    else document.getElementById('transitionHint').textContent='transition at '+toMMSS(tOut);

    const sections = agentResult.current_structure||[];
    let cur = sections[0];
    for (const s of sections) { if (elapsed>=s.start_sec) cur=s; }
    sections.forEach(s => {
      const p = document.getElementById('pill-nowStructure-'+s.start_sec);
      if (p) p.classList.toggle('active', s===cur);
    });

    if (!transitionScheduled&&remaining>0&&remaining<=5) {
      transitionScheduled = true;
      setTimeout(doLiveTransition, remaining*1000);
      showToast('🎚️ Transitioning in '+Math.ceil(remaining)+'s...');
    }
  }
}

// ── Web Audio transition effects ──────────────────────────────────────────────

function doLiveTransition() {
  if (!nextBuffer||!audioCtx) return;
  const mode = forcedMode || agentResult.transition_effect || 'crossfade';
  const fadeDur = 4; // seconds
  const tIn = agentResult.transition_in.time_sec;
  const now = audioCtx.currentTime;

  showToast(`🎛️ ${mode}...`);

  if (mode === 'lpf_sweep') {
    // song1 gets low-pass filter sweeping DOWN (muffling it out)
    const lpf1 = audioCtx.createBiquadFilter();
    lpf1.type = 'lowpass';
    lpf1.frequency.setValueAtTime(20000, now);
    lpf1.frequency.exponentialRampToValueAtTime(200, now + fadeDur);

    if (currentSource) { try { currentSource.disconnect(); } catch(e){} }
    if (currentGain) { try { currentGain.disconnect(); } catch(e){} }
    currentGain = audioCtx.createGain();
    currentGain.gain.setValueAtTime(1, now);
    currentGain.gain.linearRampToValueAtTime(0, now + fadeDur);

    // reconnect current through lpf
    const newSrc1 = audioCtx.createBufferSource();
    newSrc1.buffer = currentBuffer;
    newSrc1.connect(lpf1);
    lpf1.connect(currentGain);
    currentGain.connect(audioCtx.destination);
    newSrc1.start(0, getElapsed());
    currentSource = newSrc1;

    // song2 gets low-pass filter sweeping UP (opening up)
    const lpf2 = audioCtx.createBiquadFilter();
    lpf2.type = 'lowpass';
    lpf2.frequency.setValueAtTime(200, now);
    lpf2.frequency.exponentialRampToValueAtTime(20000, now + fadeDur);

    const gain2 = audioCtx.createGain();
    gain2.gain.setValueAtTime(0, now);
    gain2.gain.linearRampToValueAtTime(1, now + fadeDur);

    const src2 = audioCtx.createBufferSource();
    src2.buffer = nextBuffer;
    src2.connect(lpf2);
    lpf2.connect(gain2);
    gain2.connect(audioCtx.destination);
    src2.start(0, tIn);

    setTimeout(() => finishTransition(src2, gain2), fadeDur * 1000);

  } else if (mode === 'eq_sweep') {
    // song1 gets high-pass filter sweeping UP (cutting bass out)
    const hpf1 = audioCtx.createBiquadFilter();
    hpf1.type = 'highpass';
    hpf1.frequency.setValueAtTime(20, now);
    hpf1.frequency.exponentialRampToValueAtTime(500, now + fadeDur);

    if (currentSource) { try { currentSource.disconnect(); } catch(e){} }
    if (currentGain) { try { currentGain.disconnect(); } catch(e){} }
    currentGain = audioCtx.createGain();
    currentGain.gain.setValueAtTime(1, now);
    currentGain.gain.linearRampToValueAtTime(0, now + fadeDur);

    const newSrc1 = audioCtx.createBufferSource();
    newSrc1.buffer = currentBuffer;
    newSrc1.connect(hpf1);
    hpf1.connect(currentGain);
    currentGain.connect(audioCtx.destination);
    newSrc1.start(0, getElapsed());
    currentSource = newSrc1;

    // song2 gets high-pass filter sweeping DOWN (bass comes in)
    const hpf2 = audioCtx.createBiquadFilter();
    hpf2.type = 'highpass';
    hpf2.frequency.setValueAtTime(500, now);
    hpf2.frequency.exponentialRampToValueAtTime(20, now + fadeDur);

    const gain2 = audioCtx.createGain();
    gain2.gain.setValueAtTime(0, now);
    gain2.gain.linearRampToValueAtTime(1, now + fadeDur);

    const src2 = audioCtx.createBufferSource();
    src2.buffer = nextBuffer;
    src2.connect(hpf2);
    hpf2.connect(gain2);
    gain2.connect(audioCtx.destination);
    src2.start(0, tIn);

    setTimeout(() => finishTransition(src2, gain2), fadeDur * 1000);

  } else if (mode === 'beatmatch') {
    // adjust playback rate of incoming song
    const bpmRatio = (agentResult.bpm1||120) / (agentResult.bpm2||120);

    currentGain.gain.setValueAtTime(1, now);
    currentGain.gain.linearRampToValueAtTime(0, now + fadeDur);

    const gain2 = audioCtx.createGain();
    gain2.gain.setValueAtTime(0, now);
    gain2.gain.linearRampToValueAtTime(1, now + fadeDur);
    gain2.connect(audioCtx.destination);

    const src2 = audioCtx.createBufferSource();
    src2.buffer = nextBuffer;
    src2.playbackRate.value = bpmRatio;
    src2.connect(gain2);
    src2.start(0, tIn);

    setTimeout(() => finishTransition(src2, gain2), fadeDur * 1000);

  } else {
    // crossfade — standard volume fade
    currentGain.gain.setValueAtTime(1, now);
    currentGain.gain.linearRampToValueAtTime(0, now + fadeDur);

    const gain2 = audioCtx.createGain();
    gain2.gain.setValueAtTime(0, now);
    gain2.gain.linearRampToValueAtTime(1, now + fadeDur);
    gain2.connect(audioCtx.destination);

    const src2 = audioCtx.createBufferSource();
    src2.buffer = nextBuffer;
    src2.connect(gain2);
    src2.start(0, tIn);

    setTimeout(() => finishTransition(src2, gain2), fadeDur * 1000);
  }
}

function finishTransition(newSource, newGain) {
  // disconnect old source
  try { currentSource.stop(); } catch(e){}
  try { currentGain.disconnect(); } catch(e){}

  const nextSongName = agentResult.recommended_next_song.replace('.mp3','').replace(/_/g,' ');
  lastTransitionSong = agentResult.recommended_next_song;

  // mark outgoing song as played on backend
  fetch('/played', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ session_id: sessionId, song: currentSongFile })
  });

  currentSource = newSource;
  currentGain = newGain;
  currentBuffer = nextBuffer;
  currentSongFile = agentResult.recommended_next_song;
  currentSongDuration = nextBuffer.duration;
  seekOffset = agentResult.transition_in.time_sec;
  startTime = audioCtx.currentTime;
  nextBuffer = null;

  agentResult = null;
  transitionScheduled = false;
  forcedMode = null;
  isPaused = false;

  document.getElementById('nowName').textContent = nextSongName;
  document.getElementById('nowMeta').textContent = 'auto-transitioned';
  document.getElementById('upNextCard').classList.add('hidden');
  document.getElementById('transitionMarker').classList.add('hidden');
  document.getElementById('totalTime').textContent = toMMSS(currentSongDuration);
  document.getElementById('transitionHint').textContent = '';
  document.getElementById('skipNextBtn').disabled = true;
  document.getElementById('pauseBtn').textContent = '⏸ Pause';
  document.querySelectorAll('.effect-btn').forEach(b=>b.classList.remove('active'));
  renderStructure('nowStructure', []);

  currentRating = 0;
  document.querySelectorAll('.star').forEach(s=>s.classList.remove('active'));
  document.getElementById('feedbackComment').value = '';
  document.getElementById('feedbackCard').classList.remove('hidden');

  setStatus('Playing '+nextSongName+' — rate the transition above','idle');
  setTimeout(runAgent, 500);
}

async function startPlayback() {
  const song = document.getElementById('songSelect').value;
  if (!song) return alert('Select a song first');

  if (audioCtx) { audioCtx.close(); audioCtx=null; }
  audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  agentResult = null;
  transitionScheduled = false;
  seekOffset = 0;
  isPaused = false;
  forcedMode = null;
  sessionId = Math.random().toString(36).slice(2);

  setStatus('Loading audio...','thinking');
  document.getElementById('playBtn').disabled = true;
  document.getElementById('feedbackCard').classList.add('hidden');

  currentBuffer = await fetchAudio(song);
  currentSongFile = song;
  currentSongDuration = currentBuffer.duration;

  currentGain = audioCtx.createGain();
  currentGain.connect(audioCtx.destination);
  currentSource = audioCtx.createBufferSource();
  currentSource.buffer = currentBuffer;
  currentSource.connect(currentGain);
  currentSource.start(0);
  startTime = audioCtx.currentTime;
  isPlaying = true;

  document.getElementById('nowName').textContent = song.replace('.mp3','').replace(/_/g,' ');
  document.getElementById('nowMeta').textContent = 'playing now';
  document.getElementById('nowPlayingCard').classList.remove('hidden');
  document.getElementById('totalTime').textContent = toMMSS(currentSongDuration);
  document.getElementById('nowStructure').innerHTML = '';
  document.getElementById('pauseBtn').textContent = '⏸ Pause';

  clearInterval(progressInterval);
  progressInterval = setInterval(updateProgress, 500);

  setStatus('Finding next song...','thinking');
  document.getElementById('playBtn').disabled = false;
  setTimeout(runAgent, 500);
}

async function runAgent() {
  const song = currentSongFile;
  if (!song) return;
  setStatus('Agent analyzing...','thinking');

  try {
    const res = await fetch('/analyze', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ current_song: song, session_id: sessionId, forced_mode: forcedMode })
    });
    agentResult = await res.json();
    agentResult._accepted = false;

    const nextSong = agentResult.recommended_next_song;
    document.getElementById('nextName').textContent = nextSong.replace('.mp3','').replace(/_/g,' ');
    document.getElementById('nextMeta').textContent = agentResult.reason_for_recommendation;
    document.getElementById('nextCutIn').textContent = toMMSS(agentResult.transition_in.time_sec);
    document.getElementById('nextSection').textContent = agentResult.transition_in.section;
    renderStructure('nowStructure', agentResult.current_structure||[]);
    renderStructure('nextStructure', agentResult.next_structure||[]);
    document.getElementById('reasoningText').textContent = agentResult.overall_reasoning;
    document.getElementById('effectReason').textContent = agentResult.effect_reason||'—';
    document.getElementById('upNextCard').classList.remove('hidden');
    document.getElementById('acceptBtn').disabled = false;

    // highlight recommended effect
    document.querySelectorAll('.effect-btn').forEach(b=>b.classList.remove('active'));
    const eff = agentResult.transition_effect||'crossfade';
    document.querySelectorAll('.effect-btn').forEach(b => {
      const label = b.textContent.toLowerCase().replace(/[✦ ]/g,'').trim().replace(' ','_');
      if ((!forcedMode&&b.textContent.includes('Auto'))||label===eff) b.classList.add('active');
    });

    setStatus('Recommendation ready — accept to queue','idle');
    nextBuffer = await fetchAudio(nextSong);

  } catch(e) {
    setStatus('Error: '+e.message,'idle');
  }
}

function acceptTransition() {
  if (!agentResult) return;
  agentResult._accepted = true;
  document.getElementById('acceptBtn').disabled = true;
  document.getElementById('skipNextBtn').disabled = false;

  const tOut = agentResult.transition_out.time_sec;
  const marker = document.getElementById('transitionMarker');
  marker.style.left = (tOut/currentSongDuration)*100+'%';
  marker.classList.remove('hidden');

  const mode = forcedMode||agentResult.transition_effect||'crossfade';
  setStatus(`Queued — ${mode} at ${toMMSS(tOut)}`,'idle');
}

async function submitFeedback() {
  await fetch('/feedback', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      session_id: sessionId,
      song: lastTransitionSong,
      rating: currentRating||3,
      comment: document.getElementById('feedbackComment').value
    })
  });
  document.getElementById('feedbackCard').classList.add('hidden');
  setStatus('Feedback saved','idle');
}

function showToast(msg) {
  const t = document.createElement('div');
  t.className = 'crossfade-overlay';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 4000);
}

loadSongs();
</script>
</body>
</html>
